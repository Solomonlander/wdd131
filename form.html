<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script defer src="scripts/form.js"></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            
            <label for="productName">Product Name <span class="required">*</span></label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
                
            </select>

            
            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <label><input type="radio" name="rating" value="1" required> ☆</label>
                <label><input type="radio" name="rating" value="2"> ☆☆</label>
                <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
                <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
                <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
            </fieldset>

            
            <label for="installDate">Date of Installation <span class="required">*</span></label>
            <input type="date" id="installDate" name="installDate" required>

            
            <fieldset>
                <legend>Useful Features (check all that apply)</legend>
                <label><input type="checkbox" name="features" value="durable"> Durable</label>
                <label><input type="checkbox" name="features" value="lightweight"> Lightweight</label>
                <label><input type="checkbox" name="features" value="compact"> Compact</label>
            </fieldset>

            
            <label for="review">Written Review</label>
            <textarea id="review" name="review" placeholder="Share your thoughts..."></textarea>

            
            <label for="userName">Your Name</label>
            <input type="text" id="userName" name="userName" placeholder="Optional">

            
            <input type="submit" value="Submit Review" class="submit-btn">
        </form>
    </main>
<footer>
    <p><span id="copyright"></span></p>
    <p><span id="lastModified"></span></p>
</footer>
</body>

</html>
